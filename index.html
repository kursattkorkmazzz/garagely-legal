<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garagely</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root { --bg: #F7F4F5; --fg: #1C1519; --muted: #6B5F66; --brand: #E11D48; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131015; --fg: #F4EFF2; --muted: #A99DA5; --brand: #FB5A7B; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { margin: 0 0 4px; font-size: 32px; }
    p { margin: 0 0 20px; color: var(--muted); }
    a { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Garagely</h1>
    <p>Aracının kilometresi, masrafları, bakımı ve belgeleri tek yerde.<br>Your vehicle's mileage, expenses, maintenance and documents in one place.</p>
    <a href="privacy/">Gizlilik Politikası · Privacy Policy</a>
  </main>
</body>
</html>
